<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Ambient Glow Behind Central Sparkle -->
  <circle cx="256" cy="256" r="140" fill="url(#iconGrad)" opacity="0.25" filter="url(#glow)" />

  <!-- Modern Geometric Omni Diamond Sparkle -->
  <g filter="url(#glow)">
    <!-- Primary 4-point Sparkle Star -->
    <path d="M 256 80 Q 256 256 432 256 Q 256 256 256 432 Q 256 256 80 256 Q 256 256 256 80 Z" fill="url(#iconGrad)" />
    
    <!-- Secondary Angled Compass Points -->
    <path d="M 256 160 Q 256 256 352 256 Q 256 256 256 352 Q 256 256 160 256 Q 256 256 256 160 Z" fill="url(#accentGrad)" opacity="0.75" />
    
    <!-- Core Bright Node -->
    <circle cx="256" cy="256" r="32" fill="#ffffff" />
    <circle cx="256" cy="256" r="16" fill="#6366f1" />
  </g>

  <!-- Surrounding Satellite Tool Dots -->
  <circle cx="256" cy="116" r="10" fill="#ffffff" opacity="0.9" />
  <circle cx="396" cy="256" r="10" fill="#ffffff" opacity="0.9" />
  <circle cx="256" cy="396" r="10" fill="#ffffff" opacity="0.9" />
  <circle cx="116" cy="256" r="10" fill="#ffffff" opacity="0.9" />
</svg>
