<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>OmniToolbox — All-in-One Utility Hub</title>
    <meta name="description" content="Comprehensive, lightning-fast utility suite featuring 100+ calculators, financial planners, unit converter hub, student tools, camera utilities, text workbench, games, and PDF tools for mobile, tablet, and PC." />
    <meta property="og:title" content="OmniToolbox — All-in-One Utility Hub" />
    <meta property="og:description" content="Comprehensive, lightning-fast utility suite featuring 100+ calculators, financial planners, unit converter hub, student tools, camera utilities, text workbench, games, and PDF tools for mobile, tablet, and PC." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark light" />

    <!-- Universal Native App Store & Mobile Meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OmniToolbox" />
    <meta name="application-name" content="OmniToolbox" />
    <meta name="msapplication-TileColor" content="#09090b" />
    <meta name="format-detection" content="telephone=no" />

    <!-- App Store Icons & Favicons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        var saved = localStorage.getItem('omni_theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-zinc-50 text-zinc-900 antialiased selection:bg-indigo-600 selection:text-white dark:bg-zinc-950 dark:text-zinc-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
