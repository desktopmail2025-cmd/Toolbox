name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm install

      - name: Install Capacitor Android
        run: npm install @capacitor/android@^8.0.0

      - name: Verify production AdMob configuration
        shell: bash
        run: |
          grep -Fq 'USE_TEST_ADS: true' src/services/admobService.ts
          grep -Fq 'ca-app-pub-3940256099942544/6300978111' src/services/admobService.ts
          grep -Fq 'ca-app-pub-9097792601837119~1722736588' android/app/src/main/res/values/strings.xml

      - name: Build web app
        run: npm run build

      - name: Sync web app into existing Android project
        run: npx cap sync android

      - name: Verify Android project
        working-directory: android
        run: test -f gradlew && test -f settings.gradle && test -f app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniToolbox-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
